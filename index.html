<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>My Game</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f172a;
            overscroll-behavior: none;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        
#game-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0f172a;
}

#game-container canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    margin: 0;
    touch-action: none;
}


        #orientation-lock {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: #ffffff;
            background: #0f172a;
            font-family: monospace;
        }

        #orientation-lock .card {
            width: min(90vw, 420px);
            padding: 28px 22px;
            border: 2px solid #38bdf8;
            border-radius: 18px;
            background: #172554;
            box-shadow: 0 0 30px rgba(56, 189, 248, .25);
        }

        #orientation-lock .icon {
            font-size: 56px;
            line-height: 1;
            margin-bottom: 18px;
        }

        #orientation-lock h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        #orientation-lock p {
            margin: 0;
            color: #bae6fd;
            font-size: 15px;
            line-height: 1.6;
        }

        @media (orientation: portrait) {
            #game-container {
                display: none;
            }

            #orientation-lock {
                display: flex;
            }
        }

        @media (orientation: landscape) {
            #game-container {
                display: flex;
            }

            #orientation-lock {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="orientation-lock" aria-live="polite">
        <div class="card">
            <div class="icon">⟳</div>
            <h1>กรุณาหมุนโทรศัพท์เป็นแนวนอน</h1>
            <p>เกมนี้รองรับการเล่นแนวนอนเท่านั้น<br>เพื่อให้ปุ่มควบคุมและหน้าจอเกมใช้งานได้เต็มที่</p>
        </div>
    </div>

    <div id="game-container"></div>
    <script type="module" src="/main.js"></script>
</body>
</html>
